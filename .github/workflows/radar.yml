name: Radar Auto

on:
  schedule:
    # GitHub usa l'ora UTC. Le 11:55 italiane sono le 9:55 UTC con l'ora legale
    # e le 10:55 UTC con l'ora solare: girano entrambe e lo script parte solo
    # se in Italia è già l'orario scelto e oggi non ha ancora controllato.
    - cron: "55 9 * * *"
    - cron: "55 10 * * *"
  workflow_dispatch:
    inputs:
      forza:
        description: "Controlla subito, anche fuori orario"
        type: boolean
        default: true
      prova:
        description: "Solo prova: legge i siti e mostra i risultati, senza inviare avvisi né salvare"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  controlla:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Cerca annunci e invia avvisi
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          if [ "${{ inputs.prova }}" = "true" ]; then
            python -m radar --prova --rapporto data/ultima-prova.md
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.forza }}" = "true" ]; then
            python -m radar --forza
          else
            python -m radar
          fi

      - name: Salva gli annunci già visti
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "radar-auto[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "Aggiorna dati del radar ($(TZ=Europe/Rome date +%Y-%m-%d))"
            git push
          fi
