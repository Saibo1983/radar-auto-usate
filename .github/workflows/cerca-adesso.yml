name: Cerca adesso

# Avviato dal pulsante "Cerca adesso" dell'app: una ricerca subito, senza avvisi.
# I risultati vanno in data/ricerca-adesso.json, che l'app legge; con l'id di una
# ricerca salvata ("Vedi annunci") vanno in data/annunci/<id>.json e restano memorizzati.
on:
  workflow_dispatch:
    inputs:
      ricerca:
        description: "Ricerca in formato JSON"
        required: true
      richiesta:
        description: "Codice della richiesta, per riconoscere i risultati"
        required: true
      id:
        description: "Id della ricerca salvata, se avviata da Vedi annunci"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: cerca-adesso-${{ inputs.id || 'modulo' }}
  cancel-in-progress: true

jobs:
  cerca:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Cerca
        env:
          RICERCA: ${{ inputs.ricerca }}
          RICHIESTA: ${{ inputs.richiesta }}
          ID: ${{ inputs.id }}
        run: python -m radar.adesso "$RICHIESTA" "$ID"
      - name: Salva i risultati
        run: |
          git config user.name "radar-auto[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -qm "Risultati della ricerca immediata"
          for i in 1 2 3; do git pull -q --rebase && git push && break; sleep 5; done
